<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrFU Deadline & Rating Tracker // ИРИТ-РТФ</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --high: #ef4444;
            --med: #f59e0b;
            --low: #10b981;
            --accent: #6366f1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 24px 16px; }
        .container { max-width: 860px; margin: 0 auto; }
        header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 1.4rem; }
        .rating-box { background: rgba(99, 102, 241, 0.15); border: 1px solid var(--accent); padding: 8px 16px; border-radius: 10px; font-weight: 700; color: #a5b4fc; }
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .task-info h3 { font-size: 1.05rem; margin-bottom: 4px; }
        .task-meta { font-size: 0.85rem; color: var(--muted); }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .prio-high { background: rgba(239, 68, 68, 0.15); color: var(--high); border: 1px solid rgba(239, 68, 68, 0.4); }
        .prio-med { background: rgba(245, 158, 11, 0.15); color: var(--med); border: 1px solid rgba(245, 158, 11, 0.4); }
        .prio-low { background: rgba(16, 185, 129, 0.15); color: var(--low); border: 1px solid rgba(16, 185, 129, 0.4); }
        .progress-wrap { width: 100%; background: #0f172a; height: 8px; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>📊 UrFU Deadline & Rating Tracker</h1>
                <p style="color: var(--muted); font-size: 0.9rem; margin-top: 4px;">Аналитика дедлайнов и БРС для 1 курса ИВТ (ИРИТ-РТФ)</p>
            </div>
            <div class="rating-box" id="avgRating">Прогноз БРС: 84.5 / 100</div>
        </header>

        <div class="task-list" id="taskList"></div>
    </div>

    <script>
        const tasks = [
            { subject: "Основы программирования (C# / ulearn)", title: "Практика: Маршруты и графы", daysLeft: 2, maxPoints: 25, progress: 80 },
            { subject: "Линейная алгебра и аналитическая геометрия", title: "Контрольная работа №2", daysLeft: 4, maxPoints: 20, progress: 50 },
            { subject: "История России (OpenEdu)", title: "Тестирование по модулю 4", daysLeft: 7, maxPoints: 15, progress: 100 },
            { subject: "Информатика и ВТ", title: "Лабораторная работа: Алгоритмы сортировки", daysLeft: 1, maxPoints: 30, progress: 65 }
        ];

        const list = document.getElementById("taskList");
        list.innerHTML = tasks.sort((a, b) => a.daysLeft - b.daysLeft).map(t => {
            const prioClass = t.daysLeft <= 2 ? "prio-high" : (t.daysLeft <= 5 ? "prio-med" : "prio-low");
            const prioText = t.daysLeft <= 2 ? "Высокий приоритет" : (t.daysLeft <= 5 ? "Средний приоритет" : "В графике");
            return `
                <div class="task-card">
                    <div class="task-info" style="flex: 1; min-width: 240px;">
                        <h3>${t.title}</h3>
                        <div class="task-meta">${t.subject} • Осталось дней: <b>${t.daysLeft}</b> • Вес: <b>${t.maxPoints} баллов</b></div>
                        <div class="progress-wrap"><div class="progress-bar" style="width: ${t.progress}%"></div></div>
                    </div>
                    <span class="badge ${prioClass}">${prioText}</span>
                </div>
            `;
        }).join("");
    </script>
</body>
</html>
