<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>UrFU Deadline & Rating Tracker</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 24px; max-width: 850px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 16px; }
        .score-badge { background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; padding: 10px 16px; border-radius: 12px; font-weight: bold; }
        .form-box { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 20px; display: grid; grid-template-columns: 2fr 1.5fr 1fr 1fr 1fr auto; gap: 8px; }
        input, select, button { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
        button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; border: none; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .card:hover { border-color: #38bdf8; }
        .card.done { opacity: 0.45; text-decoration: line-through; }
        .tag { font-size: 11px; padding: 5px 10px; border-radius: 8px; font-weight: bold; }
        .high { background: rgba(239,68,68,0.2); color: #f87171; }
        .med { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .low { background: rgba(16,185,129,0.2); color: #34d399; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2 style="margin:0;">📊 UrFU Deadline & Rating Tracker</h2>
            <p style="color:#94a3b8; margin:4px 0 0; font-size:13px;">Добавьте свои дедлайны или кликните по задаче, чтобы отметить сдачу</p>
        </div>
        <div class="score-badge">Прогноз БРС: <span id="brs">60.0</span> / 100</div>
    </div>

    <form class="form-box" id="addForm">
        <input type="text" id="tTitle" placeholder="Название лабы / теста" required>
        <input type="text" id="tSubj" placeholder="Предмет (напр. C#)" required>
        <input type="number" id="tPts" placeholder="Баллы" min="1" max="100" required>
        <input type="number" id="tHours" placeholder="Часов до сдачи" min="1" required>
        <select id="tDiff">
            <option value="5">Сложность 5</option>
            <option value="4">Сложность 4</option>
            <option value="3" selected>Сложность 3</option>
            <option value="2">Сложность 2</option>
            <option value="1">Сложность 1</option>
        </select>
        <button type="submit">+ Добавить</button>
    </form>

    <div id="list"></div>

    <script src="data.js"></script>
    <script>
        let tasks = (window.TASKS_DATA ||).map(t => ({ ...t, done: false }));

        function recalcAndRender() {
            tasks.forEach(t => {
                t.urgencyIndex = Number(((t.maxPoints * t.difficulty) / Math.max(t.hoursLeft, 1)).toFixed(2));
                t.prio = t.urgencyIndex >= 15 ? "high" : t.urgencyIndex >= 8 ? "med" : "low";
                t.label = t.urgencyIndex >= 15 ? "ВЫСОКИЙ ПРИОРИТЕТ" : t.urgencyIndex >= 8 ? "СРЕДНИЙ ПРИОРИТЕТ" : "В ГРАФИКЕ";
            });
            tasks.sort((a, b) => b.urgencyIndex - a.urgencyIndex);

            let score = 60.0;
            document.getElementById("list").innerHTML = tasks.map((t, i) => {
                if (t.done) score += (t.maxPoints * 0.4);
                return `<div class="card ${t.done ? 'done' : ''}" onclick="toggle(${i})">
                    <div>
                        <strong>${t.title}</strong>
                        <div style="color:#94a3b8; font-size:13px; margin-top:4px;">
                            ${t.subj} • Осталось: ${t.hoursLeft} ч. • Вес: ${t.maxPoints} б. • Индекс: <b>${t.urgencyIndex}</b>
                        </div>
                    </div>
                    <span class="tag ${t.prio}">${t.done ? '✓ СДАНО' : t.label}</span>
                </div>`;
            }).join("");
            document.getElementById("brs").textContent = Math.min(score, 100).toFixed(1);
        }

        document.getElementById("addForm").addEventListener("submit", e => {
            e.preventDefault();
            tasks.push({
                title: document.getElementById("tTitle").value,
                subj: document.getElementById("tSubj").value,
                maxPoints: Number(document.getElementById("tPts").value),
                hoursLeft: Number(document.getElementById("tHours").value),
                difficulty: Number(document.getElementById("tDiff").value),
                done: false
            });
            e.target.reset();
            recalcAndRender();
        });

        function toggle(i) { tasks[i].done = !tasks[i].done; recalcAndRender(); }
        recalcAndRender();
    </script>
</body>
</html>
